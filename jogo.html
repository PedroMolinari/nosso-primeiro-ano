<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a2a55">
<title>Nosso jogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#3a2a55; --paper:#fffaf3; --sky:#cfc6f0; --rose:#f6b8c4; --butter:#ffe9a8; --font:"Pixelify Sans","Courier New",monospace; }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; overflow:hidden; background:var(--ink); color:var(--ink); font-family:var(--font); touch-action:none; user-select:none; -webkit-user-select:none; }

  /* Escolha de personagem */
  #select { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem; padding:1.5rem; background:var(--sky); }
  #select h1 { margin:0; font-size:1.8rem; text-align:center; }
  #cards { display:flex; gap:1rem; width:100%; max-width:26rem; }
  .card { flex:1; font:inherit; color:inherit; background:var(--paper); border:0; padding:1rem .5rem; display:flex; flex-direction:column; align-items:center; gap:.75rem; cursor:pointer;
    box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 var(--ink),4px 0 var(--ink),0 10px 0 rgba(58,42,85,.25); }
  .card:active { transform:translateY(3px); }
  .card:focus-visible { outline:3px dashed var(--ink); outline-offset:6px; }
  .card canvas { width:96px; height:128px; image-rendering:pixelated; background:var(--rose); }
  .card span { font-weight:700; font-size:1.1rem; }

  /* Jogo */
  #game { height:100%; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1; min-height:0; padding-top:env(safe-area-inset-top); }
  #c { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; display:block; }
  #hud { position:absolute; top:calc(env(safe-area-inset-top) + 8px); left:8px; background:var(--paper); padding:2px 10px; font-weight:700; border-radius:4px; }
  #dialog { position:absolute; left:8px; right:8px; bottom:8px; background:var(--paper); padding:.8rem 1rem; line-height:1.4;
    box-shadow:0 -3px 0 var(--ink),0 3px 0 var(--ink),-3px 0 var(--ink),3px 0 var(--ink); }
  #dialog p { margin:0 0 .3rem; }
  #dialog span { display:block; text-align:right; font-size:.8rem; }
  #pad { height:170px; padding:0 28px env(safe-area-inset-bottom); display:flex; align-items:center; justify-content:space-between; }
  #stick { position:relative; width:130px; height:130px; border-radius:50%; background:rgba(255,250,243,.15); border:3px solid rgba(255,250,243,.5); }
  #knob { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:var(--paper); }
  #act { width:84px; height:84px; border-radius:50%; border:0; font:inherit; font-weight:700; font-size:1.8rem; background:var(--butter); color:var(--ink); }
  #act:active { transform:translateY(3px); }
</style>
</head>
<body>

<div id="select">
  <h1>Escolha seu personagem</h1>
  <div id="cards"></div>
</div>

<div id="game" hidden>
  <div id="stage">
    <canvas id="c" width="160" height="240"></canvas>
    <div id="hud"></div>
    <div id="dialog" hidden><p></p><span>▼</span></div>
  </div>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <button id="act" type="button" aria-label="Interagir">A</button>
  </div>
</div>

<script src="jogo.js"></script>
</body>
</html>
